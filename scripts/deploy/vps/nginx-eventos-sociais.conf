# Bloco próprio: o GV continua no arquivo dele, e os dois convivem pelo
# server_name. O certbot reescreve este arquivo ao emitir o certificado.
server {
    listen 80;
    server_name eventos.gerenciadorviagens.tech;

    # O webhook da Meta manda o corpo inteiro, e há upload de anexo de
    # prestação; o padrão de 1M devolveria 413 sem explicação.
    client_max_body_size 25M;

    # NÃO servir /media/ aqui. Os anexos das solicitações são baixados por
    # `solicitacoes.views.baixar_anexo`, que confere permissão antes de
    # entregar o arquivo. Um `location /media/` no nginx passaria por fora
    # dessa checagem e deixaria qualquer pessoa com a URL baixar documento de
    # viagem — inclusive quem nem tem conta. Ver o comentário em settings.py.

    # Estáticos também vão pelo Django: o projeto usa WhiteNoise, que já
    # serve com hash no nome e cabeçalho de cache. Duplicar aqui só criaria
    # um segundo lugar para esquecer de atualizar.
    location / {
        proxy_pass http://127.0.0.1:8100;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}
