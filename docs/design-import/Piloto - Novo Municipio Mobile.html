<!DOCTYPE html>
<html lang="pt-br" data-densidade="padrao" data-dourado="institucional" data-divisorias="filete">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Novo município — mobile</title>
<link rel="stylesheet" href="design-system/components-v3-2.css">
</head>
<body class="m-moldura">
<div class="m-app">
  <header class="m-topo">
    <div class="m-topo__marca">
      <span class="m-topo__moldura"><img src="assets/brasao-pcpr.svg" alt="Brasão da Polícia Civil do Paraná"></span>
      <span class="m-topo__sigla">PCPR</span>
    </div>
    <div class="m-topo__fim">
      <button class="m-icone" aria-label="Notificações"><svg class="ui-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"/></svg><span class="m-icone__ponto"></span></button>
      <button class="m-avatar" aria-label="Cel. Marcos Ribeiro">MR</button>
    </div>
  </header>

  <div class="mcf-topo">
    <a href="Piloto - Cadastros (desktop).html"><svg class="ui-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 18-6-6 6-6"/></svg>Voltar para Municípios</a>
    <h1>Novo município</h1>
    <p>Cadastre uma opção disponível nas solicitações.</p>
  </div>

  <div class="pn">
    <section class="mf-sec">
      <label class="mf-campo"><span>Nome<em>*</em></span><input class="ctrl" type="text" placeholder="Ex.: Curitiba"></label>
      <label class="mf-campo"><span>Estado<em>*</em></span><select class="ctrl"><option value="" selected>Selecione...</option><option>Paraná</option></select></label>
      <label class="mf-campo" style="margin-bottom:0"><span>Região<em>*</em></span><select class="ctrl"><option value="" selected>Selecione...</option><option>Metropolitana de Curitiba</option><option>Norte Central</option><option>Oeste</option><option>Centro-Sul</option><option>Centro Oriental</option><option>Sudoeste</option></select></label>
    </section>
  </div>
  <div style="height:80px"></div>

  <div class="mf-acoes">
    <button class="btn--secundaria">Cancelar</button>
    <button class="btn-primaria">Salvar município</button>
  </div>
</div>
</body>
</html>
