<!DOCTYPE html>
<html lang="pt-br" data-densidade="padrao" data-dourado="institucional" data-divisorias="filete">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Padrão de Listagem — Estados</title>
<link rel="stylesheet" href="design-system/components-v3-2.css">
<style>
.seletor{position:sticky;top:0;z-index:80;background:#1a1917;border-bottom:2px solid #bea45a;display:flex;align-items:center;gap:6px;padding:10px 24px;flex-wrap:wrap}
.seletor button{height:32px;padding:0 14px;border-radius:99px;border:1px solid #46443f;background:#23221e;color:#c9c4bb;font:600 12.5px "Segoe UI",sans-serif;cursor:pointer;white-space:nowrap}
.seletor button:hover{border-color:#78736a;color:#fff}
.seletor button[aria-current]{background:#bea45a;border-color:#bea45a;color:#1a1917}
</style>
</head>
<body>
<nav class="seletor" id="seletor" aria-label="Estados desta tela"></nav>
<div class="pagina" id="pagina">
<header class="ident"><div class="ident__in">
  <div class="marca">
    <span class="marca__moldura"><img src="assets/brasao-pcpr.svg" alt="Brasão da Polícia Civil do Paraná"></span>
    <span class="marca__org">Polícia Civil do Paraná</span>
  </div>
  <span class="risco-i" aria-hidden="true"></span>
  <span class="ident__sistema">Sistema de Gestão de Eventos Sociais</span>
  <div class="ident__fim">
    <button class="ident-icone" aria-label="Notificações"><svg class="ui-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"/></svg><span class="ident-icone__ponto"></span></button>
    <button class="ident-icone" aria-label="Ajuda"><svg class="ui-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="10"/><path d="M12 16v-4"/><path d="M12 8h.01"/></svg></button>
    <button class="ident-user" aria-haspopup="true" aria-expanded="false">
      <span class="ident-user__av">MR</span><span class="ident-user__n">Cel. Marcos Ribeiro</span>
      <svg class="ui-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg>
    </button>
  </div>
</div></header>

<nav class="navbar"><div class="navbar__in">
  <button class="modulo" aria-haspopup="true" aria-expanded="false">
    <span class="modulo__nome">Eventos Sociais</span>
    <svg class="ui-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg>
  </button>
  <div class="nav-mod">
    <a href="#" aria-current="page">Solicitações</a>
    <a href="#">Painel</a>
    <a href="#">Cadastros</a>
    <a href="#">Relatórios</a>
  </div>
</div></nav>

<main class="conteudo" id="folha"></main>
</div>

<script src="piloto-v3-2.js"></script>
<script>
const CENARIOS=[
{k:'normal',r:'1 · Normal com dados'},
{k:'painel',r:'2 · Filtros avançados abertos'},
{k:'vazio',r:'3 · Vazio (sem registros)'},
{k:'sem-resultados',r:'4 · Sem resultados da busca'},
{k:'hover',r:'5 · Hover de linha'},
{k:'menu',r:'6 · Menu de ações aberto'},
{k:'ordenacao',r:'7 · Ordenação ativa'}];

function resetEst(){
  est.ordem='data';est.desc=true;est.fila='';est.sel=null;est.painel=false;est.cenario='normal';
  Object.keys(est.f).forEach(k=>est.f[k]='');
}

function aplicar(k){
  resetEst();
  if(k==='painel'){est.painel=true}
  if(k==='vazio'){est.fila='rascunhos';est.cenario='vazio'}
  if(k==='sem-resultados'){est.f.status='Cancelada';est.f.municipio='Curitiba'}
  if(k==='ordenacao'){est.ordem='municipio';est.desc=false}
  render();
  if(k==='hover'){
    const tr=document.querySelectorAll('tbody tr')[2];
    if(tr)tr.classList.add('forcar-hover');
  }
  if(k==='menu'){
    setTimeout(()=>{
      const trigger=document.querySelector('tbody tr [data-dd]');
      if(trigger){
        const c=document.querySelector(`[data-dd-c="${trigger.dataset.dd}"]`);
        if(c){c.hidden=false;trigger.setAttribute('aria-expanded','true')}
      }
    },0);
  }
  document.querySelectorAll('#seletor button').forEach(b=>b.toggleAttribute('aria-current',b.dataset.k===k));
}

const bar=document.getElementById('seletor');
bar.innerHTML=CENARIOS.map(c=>`<button data-k="${c.k}">${c.r}</button>`).join('')+'<a href="Padrao de Listagem - Mobile.html" style="margin-left:auto;height:32px;display:inline-flex;align-items:center;padding:0 14px;border-radius:99px;border:1px solid #46443f;background:#23221e;color:#c9c4bb;font:600 12.5px \'Segoe UI\',sans-serif;text-decoration:none">Ver versão mobile →</a>';
bar.addEventListener('click',e=>{const b=e.target.closest('button');if(b)aplicar(b.dataset.k)});
aplicar('normal');
</script>
</body>
</html>
