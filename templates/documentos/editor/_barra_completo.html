{% comment %}A barra de formatação do editor completo (m057): na tela própria e no visualizador inline (m142).{% endcomment %}
    <div class="de-barra__grupo">
      <button type="button" class="de-icone" data-dcp-cmd="undo" title="Desfazer (Ctrl+Z)" aria-label="Desfazer">{% include "components/icon.html" with nome="undo" %}</button>
      <button type="button" class="de-icone" data-dcp-cmd="redo" title="Refazer (Ctrl+Y)" aria-label="Refazer">{% include "components/icon.html" with nome="redo" %}</button>
    </div>
    <span class="de-barra__sep" aria-hidden="true"></span>
    <div class="de-barra__grupo">
      <select class="de-zoom dcp-estilo" data-dcp-bloco aria-label="Estilo do parágrafo">
        <option value="">Estilo</option>
        <option value="p">Texto normal</option>
        <option value="h1">Título</option>
        <option value="h2">Subtítulo</option>
        <option value="h3">Título de seção</option>
      </select>
    </div>
    <span class="de-barra__sep" aria-hidden="true"></span>
    <div class="de-barra__grupo">
      <button type="button" class="de-icone dcp-letra" data-dcp-cmd="bold" title="Negrito (Ctrl+B)" aria-label="Negrito"><b>N</b></button>
      <button type="button" class="de-icone dcp-letra" data-dcp-cmd="italic" title="Itálico (Ctrl+I)" aria-label="Itálico"><i>I</i></button>
      <button type="button" class="de-icone dcp-letra" data-dcp-cmd="underline" title="Sublinhado (Ctrl+U)" aria-label="Sublinhado"><u>S</u></button>
      <button type="button" class="de-icone dcp-letra" data-dcp-cmd="strikeThrough" title="Tachado" aria-label="Tachado"><s>T</s></button>
      <button type="button" class="de-icone dcp-letra" data-dcp-cmd="removeFormat" title="Limpar formatação" aria-label="Limpar formatação">{% include "components/icon.html" with nome="x" %}</button>
    </div>
    <span class="de-barra__sep" aria-hidden="true"></span>
    <div class="de-barra__grupo">
      <button type="button" class="de-icone dcp-alinha dcp-alinha--esq" data-dcp-cmd="justifyLeft" title="Alinhar à esquerda" aria-label="Alinhar à esquerda"><span></span></button>
      <button type="button" class="de-icone dcp-alinha dcp-alinha--centro" data-dcp-cmd="justifyCenter" title="Centralizar" aria-label="Centralizar"><span></span></button>
      <button type="button" class="de-icone dcp-alinha dcp-alinha--dir" data-dcp-cmd="justifyRight" title="Alinhar à direita" aria-label="Alinhar à direita"><span></span></button>
      <button type="button" class="de-icone dcp-alinha dcp-alinha--just" data-dcp-cmd="justifyFull" title="Justificar" aria-label="Justificar"><span></span></button>
    </div>
    <span class="de-barra__sep" aria-hidden="true"></span>
    <div class="de-barra__grupo">
      <button type="button" class="de-texto-botao" data-dcp-cmd="insertUnorderedList" title="Lista com marcadores">• Lista</button>
      <button type="button" class="de-texto-botao" data-dcp-cmd="insertOrderedList" title="Lista numerada">1. Lista</button>
      <button type="button" class="de-icone" data-dcp-cmd="outdent" title="Diminuir recuo" aria-label="Diminuir recuo">{% include "components/icon.html" with nome="chevron-left" %}</button>
      <button type="button" class="de-icone" data-dcp-cmd="indent" title="Aumentar recuo" aria-label="Aumentar recuo">{% include "components/icon.html" with nome="chevron-right" %}</button>
    </div>
    <span class="de-barra__sep" aria-hidden="true"></span>
    <div class="de-barra__grupo">
      <button type="button" class="de-texto-botao" data-dcp-tabela="inserir" title="Inserir tabela">{% include "components/icon.html" with nome="columns" %}Tabela</button>
      <button type="button" class="de-texto-botao" data-dcp-tabela="linha" title="Inserir linha abaixo">+ Linha</button>
      <button type="button" class="de-texto-botao" data-dcp-tabela="coluna" title="Inserir coluna à direita">+ Coluna</button>
      <button type="button" class="de-texto-botao" data-dcp-tabela="sem-linha" title="Excluir a linha">− Linha</button>
      <button type="button" class="de-texto-botao" data-dcp-tabela="sem-coluna" title="Excluir a coluna">− Coluna</button>
      <button type="button" class="de-texto-botao" data-dcp-cmd="insertHorizontalRule" title="Linha horizontal">―</button>
      <button type="button" class="de-texto-botao" data-dcp-quebra title="Quebra de página antes do parágrafo">{% include "components/icon.html" with nome="page-break" %}Quebra</button>
    </div>
